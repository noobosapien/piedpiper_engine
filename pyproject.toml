[build-system]
requires = [
    "setuptools",
    "setuptools-scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "piedpiper_engine"
authors = [{ name = "Migara", email = "devdude@wondersplot.co.nz" }]
description = "An event driven engine to create and manage AI agents for innovative applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "asyncio==3.4.3",
    "iniconfig==2.0.0",
    "packaging==24.2",
    "pluggy==1.5.0",
    "pytest==8.3.4",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/noobosapien/piedpiper_engine"
Issues = "https://github.com/noobosapien/piedpiper_engine/issues"


[tool.setuptools]
platforms = ["unix", "linux", "osx", "cygwin", "win32"]
package-dir = { "piedpiper_engine" = "piedpiper_engine" }

[tool.setuptools.dynamic]
version = {attr = "piedpiper_engine.__version__"}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = "tests"

[tool.coverage.run]
branch = true
parallel = true
omit = [
    "piedpiper_engine/__init__.py",
    "piedpiper_engine/version.py",
]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.coverage.paths]
source = [
    "piedpiper_engine/*",
]

[tool.coverage.html]
directory = "reports"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
